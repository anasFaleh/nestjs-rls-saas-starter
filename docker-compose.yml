# Local development database. `docker compose up -d`
services:
  postgres:
    image: postgres:16-alpine
    container_name: saas-starter-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: saas_starter
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d saas_starter"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
